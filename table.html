<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Table</title>
    <style>table, th, td {
  border: 1px solid black;       /* Width, style, and color */
  border-collapse: collapse;    /* Prevents double borders */
}
</style>
</head>
<body>
    <div>
        <table border="1">
            <tr>
                <td rowspan="3">Day</td>
                <th colspan="5">seminar</th>
                
            </tr>
            <tr>
                
                <td colspan="2">Schedule</td>
                
                
                <th rowspan="2" colspan="2"> Topic</th>
            </tr>
            <tr>
                
                <th>Begin</th>
                <th>End</th>
                
            </tr>
            <tr>
                <td rowspan="2">monaday</td>
                <td rowspan="2">8:00</td>
                <td rowspan="2">5:00</td>
                <td colspan="2">intoduction to xml</td>
                
            </tr>
            <tr>
                
                <td colspan="2">validity: dtd and relax ng</td>
                
            </tr>
            <tr>
                <td rowspan="3">tuesday</td>
                <td>8:00</td>
                <td>11:00</td>
                <td rowspan="2" colspan="2">Xpath</td>
                
            </tr>
            <tr>
                
                <td>11:00</td>
                <td>2:00</td>
                
            </tr>
            <tr>
                
                <td>2:00</td>
                <td>5:00</td>
                <td  colspan="2">Xsl tranformation</td>
                
            </tr>
            <tr>
                <td>wednesday</td>
                <td>8:00</td>
                <td>12:00</td>
                <td colspan="2">XSL formatting objects</td>
                
            </tr>
        </table>
    </div>
</body>
</html>
