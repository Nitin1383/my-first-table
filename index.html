<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    
    <style>
table, th, td,tr{
    border: 1px solid black;
    border-collapse: collapse;
}
</style>
</head>
<body>
    <h1>Table of the days</h1>
    <div>
        <table border="1">
            <tr>
                <th colspan="5">Time table</th>
                
            </tr>
            <tr>
                <td rowspan="5">hour</td>
                <th >monaday</th>
                <th >tuesday</th>
                <th >wednesday</th>
                <th >thursday</th>
            </tr>
            <tr>
               
                <td>science</td>
                <td>maths</td>
                <td>science</td>
                <td>hindi</td>
            </tr>
            <tr>
                
                <td>science </td>
                <td>maths</td>
                <td>hindi </td>
                <td>maths</td>
            </tr>
            <tr>
                
                <th colspan="4">lunch</th>
                
            </tr>
            <tr>
               
                <td>scince</td>
                <td>maths</td>
                <td>english</td>
                <td>hindi</td>
            </tr>
        </table>
    </div>
</body>
</html>
